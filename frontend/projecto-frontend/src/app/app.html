<!-- Pantalla de carga inicial mientras se valida el token -->
<div *ngIf="cargando" class="loading-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
  <div class="spinner"></div>
  <p>Verificando sesión, por favor espere...</p>
</div>

<!-- Contenido principal de la app (se muestra solo cuando termina de validar) -->
<router-outlet *ngIf="!cargando"></router-outlet>
