<div class="tarjeta-publicacion">
  <!-- Cabecera de la publicación -->
  <div class="header">
    <strong>@{{ post().usuario?.nombre || 'Usuario' }}</strong>
    <span class="fecha">{{ post().createdAt | date:'short' }}</span>
  </div>

  <!-- Contenido de texto -->
  <h4>{{ post().titulo }}</h4>
  <p>{{ post().descripcion }}</p>

  <!-- 🖼️ Imagen de la publicación -->
  @if (post().imagen_publicacion) {
    <div class="imagen-container">
      <img [src]="post().imagen_publicacion | imagenUrl:'post'" 
           alt="Imagen de la publicación" 
           class="post-img" 
           style="max-width: 100%; height: auto; border-radius: 8px;" />
    </div>
  }

  <!-- Botones de Acción -->
  <div class="acciones">
    <button (click)="darLike()">❤️ Me gusta ({{ post().me_gusta?.length || 0 }})</button>
    
    @if (puedeEliminar()) {
      <button (click)="eliminar()" class="btn-eliminar">🗑️ Eliminar</button>
    }
  </div>

</div>
