<div style="padding: 30px; color: white; background: #222;">

  <h1>PRUEBA DE DETALLE</h1>

  <div *ngIf="publicacion; else cargando">

    <h2>{{ publicacion.titulo }}</h2>

    <p>{{ publicacion.descripcion }}</p>

    <p>Usuario: {{ publicacion.usuario?.nombre }}</p>

    <p>ID: {{ publicacion._id }}</p>

    <p>Estado: PUBLICACIÓN CARGADA</p>

  </div>

  <ng-template #cargando>
    <h2>PUBLICACIÓN NO DETECTADA</h2>
  </ng-template>

</div>
